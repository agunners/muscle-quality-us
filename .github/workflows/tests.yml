name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No data or model files in the repository
        run: |
          bad=$(git ls-files | grep -iE '\.(dcm|npy|npz|parquet|pkl|pt|pth|ckpt|onnx|h5|mp4|avi|mov|zip|xlsx|png|jpe?g|tiff?)$' | grep -vx 'forVImuscle.jpg' || true)
          if [ -n "$bad" ]; then echo "Data or model files are tracked:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: python -m pytest -q
