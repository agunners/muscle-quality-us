[pytest]
markers =
    integration: marks tests that require the real transport/ data (deselect with -k "not integration")
# Never collect inside the linked data folders (an owner's clone links private/, data/ and transport/ to real data and to
# sibling repositories that carry test suites of their own). The first entries are pytest's own defaults.
norecursedirs = .* *.egg build dist venv .venv node_modules private data transport runtime exports model_
